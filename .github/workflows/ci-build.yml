name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: Static analysis

    runs-on: ubuntu-latest

    steps:
      - name: Install
        run: |
          sudo apt update
          sudo apt install cppcheck

      - name: Clone
        uses: actions/checkout@v4

      - name: cppcheck
        run: cppcheck --std=c++17 src/

  code-format:
    name: Code format check

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: clang-format
        run: find src -type f -name \*.cc -o -name \*.h | xargs clang-format --dry-run --Werror

  android:
    name: Android APK (arm64 + x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the releases

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: os/android/app/.cxx
          key: android-f1-sdl2328-v1

      # A stable signing key from the repo secrets (THOR_KEYSTORE_B64, the
      # keystore in base64, and THOR_KEYSTORE_PASSWORD), so each APK installs
      # over the last one. Without them the APK is signed with a one-off key:
      # it still installs, but the next one needs the old one uninstalled.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Pasted secrets often carry a stray newline or space.
            PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > os/android/thor.keystore
            if ! keytool -list -keystore os/android/thor.keystore -storepass "$PW" -alias fallout1thor > /dev/null; then
              echo "::error::THOR_KEYSTORE_B64 / THOR_KEYSTORE_PASSWORD don't open the key: re-paste both secrets"
              exit 1
            fi
            {
              echo "storeFile=thor.keystore"
              echo "storePassword=$PW"
              echo "keyAlias=fallout1thor"
              echo "keyPassword=$PW"
            } > os/android/debug-keystore.properties
            echo "SIGNING=stable" >> "$GITHUB_ENV"
            echo "stable signing key: yes"
          else
            echo "SIGNING=one-off" >> "$GITHUB_ENV"
            echo "::warning::No THOR_KEYSTORE_B64 / THOR_KEYSTORE_PASSWORD secrets: this APK uses a one-off key"
          fi

      # The phone build: optimized native code, what is played and tested.
      - name: Build APK
        run: |
          cd os/android
          timeout 900 ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp os/android/app/build/outputs/apk/release/app-release.apk out/Fallout1-Dualscreen.apk
          (cd out && sha256sum Fallout1-Dualscreen.apk > Fallout1-Dualscreen.apk.sha256)
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --verbose out/Fallout1-Dualscreen.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fallout1-Dualscreen-apk
          path: out/Fallout1-Dualscreen.apk*
          if-no-files-found: error

      - name: Publish as the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNING" = "stable" ]; then
            SIGN_NOTE="Signed with the port's stable key: installs over earlier builds."
          else
            SIGN_NOTE="Signed with a one-off key (no signing secrets set yet): uninstall the previous build before installing this one."
          fi
          cat > notes.md <<EOF
          Built automatically from ${GITHUB_SHA::7}: $(git log -1 --format=%s)

          Fallout 1 Community Edition, adapted for dual-screen devices such as the AYN Thor. Installs beside the original app, never over it. No game data inside: you need your own copy of Fallout 1.

          ${SIGN_NOTE}

          Free and non-commercial, under the license in LICENSE.md (LICENSE.md).
          EOF
          sed -i 's/^          //' notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Fallout1-Dualscreen.apk out/Fallout1-Dualscreen.apk.sha256 --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes-file notes.md


  ios:
    name: iOS

    runs-on: macos-13

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: ios-cmake-v2

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D ENABLE_BITCODE=0 \
            -D PLATFORM=OS64 \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce.ipa
          path:  build/fallout-ce.ipa
          retention-days: 7

  linux:
    name: Linux (${{ matrix.arch }})

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - x64

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies (x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install --allow-downgrades libpcre2-8-0=10.34-7
          sudo apt install g++-multilib libsdl2-dev:i386 zlib1g-dev:i386

      - name: Dependencies (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt update
          sudo apt install libsdl2-dev zlib1g-dev

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-${{ matrix.arch }}-cmake-v1

      - name: Configure (x86)
        if: matrix.arch == 'x86'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/Linux32.cmake \
            # EOL

      - name: Configure (x64)
        if: matrix.arch == 'x64'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-linux-${{ matrix.arch }}
          path:  build/fallout-ce
          retention-days: 7

  macos:
    name: macOS

    runs-on: macos-13

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: macos-cmake-v4

      - name: Configure
        run: |
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-macos.dmg
          path:  build/Fallout Community Edition.dmg
          retention-days: 7

  windows:
    name: Windows (${{ matrix.arch }})

    runs-on: windows-2019

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator-platform: Win32
          - arch: x64
            generator-platform: x64

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: windows-${{ matrix.arch }}-cmake-v1

      - name: Configure
        run: |
          cmake \
            -B build \
            -G "Visual Studio 16 2019" \
            -A ${{ matrix.generator-platform }} \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            # EOL

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout-ce-windows-${{ matrix.arch }}
          path:  build/RelWithDebInfo/fallout-ce.exe
          retention-days: 7
