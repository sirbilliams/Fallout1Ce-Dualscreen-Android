plugins {
    id 'com.android.application'
}


def sdlJavaBindingsDir = file('src/main/java/org/libsdl/app')

// Native build directories are named after CMake's build type, not the
// variant (`phone` builds Release, see buildTypes).
def nativeBuildDirNames = [debug: 'Debug', release: 'Release', phone: 'Release']

// The SDL Java sources CMake fetched for [variantName]'s native build type.
// Each configuration of it (the phone and release builds share the type, a
// plugin upgrade leaves the old one) has its own hash directory: all of them
// are checked.
def findFetchedSdlJavaBindingsDirs = { String variantName ->
    String variantCap = nativeBuildDirNames.get(variantName, variantName.capitalize())
    File intermediatesVariantDir = file("build/intermediates/cxx/${variantCap}")
    if (!intermediatesVariantDir.isDirectory()) {
        throw new GradleException("SDL sync check failed: missing active CXX intermediates under ${intermediatesVariantDir}. Run externalNativeBuild${variantName.capitalize()} first.")
    }

    File[] activeHashDirs = intermediatesVariantDir.listFiles()
    if (activeHashDirs == null) {
        throw new GradleException("SDL sync check failed: could not list active CXX intermediates under ${intermediatesVariantDir}.")
    }

    // Any ABI's copy will do (the CI emulator build is x86_64 only).
    List<File> fetchedDirs = activeHashDirs.findAll { it.isDirectory() }.sort { a, b -> a.name <=> b.name }.collect { hashDir ->
        List<File> abiDirs = (file(".cxx/${variantCap}/${hashDir.name}").listFiles() ?: new File[0]).findAll { it.isDirectory() }.sort { a, b -> a.name <=> b.name }
        abiDirs.collect { abiDir ->
            new File(abiDir, "_deps/sdl2-src/android-project/app/src/main/java/org/libsdl/app")
        }.find { it.isDirectory() }
    }.findAll { it != null }

    if (fetchedDirs.isEmpty()) {
        throw new GradleException("SDL sync check failed: could not locate fetched SDL Java bindings under .cxx/${variantCap}.")
    }

    return fetchedDirs
}

def assertSdlJavaBindingsMatch = { String variantName ->
    findFetchedSdlJavaBindingsDirs(variantName).each { File fetchedDir ->
        if (!sdlJavaBindingsDir.isDirectory()) {
            throw new GradleException("SDL sync check failed: committed SDL Java bindings directory is missing or unreadable: ${sdlJavaBindingsDir}.")
        }

        File[] committedFiles = sdlJavaBindingsDir.listFiles()
        if (committedFiles == null) {
            throw new GradleException("SDL sync check failed: could not list committed SDL Java bindings directory: ${sdlJavaBindingsDir}.")
        }

        File[] fetchedFiles = fetchedDir.listFiles()
        if (fetchedFiles == null) {
            throw new GradleException("SDL sync check failed: could not list fetched SDL Java bindings directory: ${fetchedDir}.")
        }

        Set<String> committedNames = committedFiles
            .findAll { it.isFile() && it.name.endsWith('.java') }
            .collect { it.name }
            .toSet()
        Set<String> fetchedNames = fetchedFiles
            .findAll { it.isFile() && it.name.endsWith('.java') }
            .collect { it.name }
            .toSet()

        Set<String> missingFromCommitted = fetchedNames - committedNames
        Set<String> extraInCommitted = committedNames - fetchedNames

        if (!missingFromCommitted.isEmpty() || !extraInCommitted.isEmpty()) {
            throw new GradleException(
                "SDL Android Java bindings are out of sync with native SDL for ${variantName}.\n" +
                "Fetched SDL dir: ${fetchedDir}\n" +
                "Missing from committed bindings: ${missingFromCommitted.sort()}\n" +
                "Extra committed bindings: ${extraInCommitted.sort()}\n" +
                "Sync os/android/app/src/main/java/org/libsdl/app from the fetched SDL android-project sources."
            )
        }

        List<String> changedFiles = committedNames.findAll { fileName ->
            File committedFile = new File(sdlJavaBindingsDir, fileName)
            File fetchedFile = new File(fetchedDir, fileName)
            committedFile.getText('UTF-8') != fetchedFile.getText('UTF-8')
        }.sort()

        if (!changedFiles.isEmpty()) {
            throw new GradleException(
                "SDL Android Java bindings are out of sync with native SDL for ${variantName}.\n" +
                "Fetched SDL dir: ${fetchedDir}\n" +
                "Changed files: ${changedFiles}\n" +
                "Sync os/android/app/src/main/java/org/libsdl/app from the fetched SDL android-project sources."
            )
        }
    }
}


android {
    namespace 'com.alexbatalov.falloutce'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.sirbilliams.fallout1ce.dualscreen'
        minSdk 24
        targetSdk 35
        versionCode 1000 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int)
        versionName '1.0.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                abiFilters 'arm64-v8a', 'x86_64'

                // TODO: Remove once format issues are resolved.
                cppFlags '-Wno-format-security'

                // Specify target library explicitly as there is a shared zlib,
                // that we don't need to be linked in.
                targets 'fallout-ce'
            }
        }
    }

    signingConfigs {
        // Override default debug signing config to make sure every CI runner
        // uses the same key for painless updates.
        def debugKeystorePropertiesFile = rootProject.file('debug-keystore.properties')
        if (debugKeystorePropertiesFile.exists()) {
            def debugKeystoreProperties = new Properties()
            debugKeystoreProperties.load(new FileInputStream(debugKeystorePropertiesFile))

            debug {
                storeFile rootProject.file(debugKeystoreProperties.getProperty('storeFile'))
                storePassword debugKeystoreProperties.getProperty('storePassword')
                keyAlias debugKeystoreProperties.getProperty('keyAlias')
                keyPassword debugKeystoreProperties.getProperty('keyPassword')
            }
        }

        def releaseKeystoreProperties = new Properties()
        def releaseKeystorePropertiesFile = rootProject.file('release-keystore.properties')
        if (releaseKeystorePropertiesFile.exists()) {
            releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))

            release {
                storeFile rootProject.file(releaseKeystoreProperties.getProperty('storeFile'))
                storePassword releaseKeystoreProperties.getProperty('storePassword')
                keyAlias releaseKeystoreProperties.getProperty('keyAlias')
                keyPassword releaseKeystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // Prevents signing keys clashes between debug and release versions
            // for painless development.
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Release signing config is optional and might not be present in CI
            // builds, hence `findByName`.
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug

            // Pin CMake's build type (AGP defaults release to RelWithDebInfo), so the
            // native build lands where nativeBuildDirNames expects it.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { jniLibs { useLegacyPackaging true } }
    applicationVariants.all { variant ->
        if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
            def checkTask = tasks.register("checkSdlJavaBindingsSync${variant.name.capitalize()}") {
                dependsOn("externalNativeBuild${variant.name.capitalize()}")
                doLast { assertSdlJavaBindingsMatch(variant.name) }
            }
            tasks["merge${variant.name.capitalize()}Assets"].dependsOn(checkTask)
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path '../../../CMakeLists.txt'
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
